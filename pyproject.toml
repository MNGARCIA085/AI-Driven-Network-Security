[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "net_security"
version = "0.1.0"
requires-python = ">=3.10"

dependencies = [
  "hydra-core==1.3.2",
  "imbalanced_learn==0.14.0",
  "joblib==1.5.2",
  "matplotlib==3.10.8",
  "mlflow==3.4.0",
  "mlflow_skinny==3.4.0",
  "mlflow_tracing==3.4.0",
  "numpy==2.2.6",
  "omegaconf==2.3.0",
  "pandas==2.3.3",
  "ray==2.50.0",
  "scikit_learn==1.7.2",
  "seaborn==0.13.2",
  "torch==2.8.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]




 